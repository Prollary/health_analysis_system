<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 portrait; margin: 2.5cm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "SimSun", "宋体", "Microsoft YaHei", serif;
    background: #fff;
    width: 210mm;
    padding: 2.5cm;
  }
  svg { display: block; width: 165mm; }
</style>
</head>
<body>
<!--
  设计说明：
  - 5 列中心 X：56 / 168 / 280 / 392 / 504
  - 模块框与子项框宽度均为 98px（x = center-49）
  - 相邻模块间距 = (168-49)-(56+49) = 14px，严格无重叠
  - 子项竖向排列，不横向扩展，彻底避免遮挡
-->
<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg"
     font-family="SimSun, 宋体, Microsoft YaHei, serif">

  <!-- ══════════ 系统标题 ══════════ -->
  <rect x="80" y="8" width="400" height="52" rx="4"
        fill="#fff" stroke="#000" stroke-width="2.2"/>
  <text x="280" y="31" text-anchor="middle" font-size="15" font-weight="bold">智慧家居健康分析系统</text>
  <text x="280" y="52" text-anchor="middle" font-size="15" font-weight="bold">功能需求架构</text>

  <!-- 标题底部 → 水平总线 -->
  <line x1="280" y1="60" x2="280" y2="90" stroke="#000" stroke-width="1.6"/>
  <line x1="56"  y1="90" x2="504" y2="90" stroke="#000" stroke-width="1.6"/>
  <!-- 5 根竖线下落至各模块框顶部 -->
  <line x1="56"  y1="90" x2="56"  y2="108" stroke="#000" stroke-width="1.6"/>
  <line x1="168" y1="90" x2="168" y2="108" stroke="#000" stroke-width="1.6"/>
  <line x1="280" y1="90" x2="280" y2="108" stroke="#000" stroke-width="1.6"/>
  <line x1="392" y1="90" x2="392" y2="108" stroke="#000" stroke-width="1.6"/>
  <line x1="504" y1="90" x2="504" y2="108" stroke="#000" stroke-width="1.6"/>

  <!-- ══════════ 五大模块框（y=108, h=48）══════════ -->
  <!-- 模块1：x=7  center=56  右边界=105 -->
  <rect x="7"   y="108" width="98" height="48" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="56"  y="128" text-anchor="middle" font-size="12" font-weight="bold">数据采集</text>
  <text x="56"  y="148" text-anchor="middle" font-size="12" font-weight="bold">与感知模块</text>

  <!-- 模块2：x=119 center=168 左边界=119 (间距14px) -->
  <rect x="119" y="108" width="98" height="48" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="168" y="128" text-anchor="middle" font-size="12" font-weight="bold">数据存储</text>
  <text x="168" y="148" text-anchor="middle" font-size="12" font-weight="bold">与管理模块</text>

  <!-- 模块3：x=231 center=280 -->
  <rect x="231" y="108" width="98" height="48" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" font-weight="bold">智能健康</text>
  <text x="280" y="148" text-anchor="middle" font-size="12" font-weight="bold">分析模块</text>

  <!-- 模块4：x=343 center=392 -->
  <rect x="343" y="108" width="98" height="48" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="392" y="128" text-anchor="middle" font-size="12" font-weight="bold">用户交互</text>
  <text x="392" y="148" text-anchor="middle" font-size="12" font-weight="bold">与服务模块</text>

  <!-- 模块5：x=455 center=504 右边界=553 -->
  <rect x="455" y="108" width="98" height="48" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="504" y="128" text-anchor="middle" font-size="12" font-weight="bold">系统安全</text>
  <text x="504" y="148" text-anchor="middle" font-size="12" font-weight="bold">与合规模块</text>

  <!-- ══════════ 模块底部 → 功能子项竖向排列 ══════════
       子项框与模块框等宽（98px），同列中心，保证无横向重叠。
       子项1 y=168  子项2 y=214  子项3 y=260  每框高36px
  ════════════════════════════════════════════════════════ -->

  <!-- 连线：模块底(y=156) → 子项1顶(y=168) -->
  <line x1="56"  y1="156" x2="56"  y2="168" stroke="#000" stroke-width="1.3"/>
  <line x1="168" y1="156" x2="168" y2="168" stroke="#000" stroke-width="1.3"/>
  <line x1="280" y1="156" x2="280" y2="168" stroke="#000" stroke-width="1.3"/>
  <line x1="392" y1="156" x2="392" y2="168" stroke="#000" stroke-width="1.3"/>
  <line x1="504" y1="156" x2="504" y2="168" stroke="#000" stroke-width="1.3"/>

  <!-- ── 子项 1（y=168, h=36, 底=204）── -->
  <rect x="7"   y="168" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="56"  y="183" text-anchor="middle" font-size="10">生理体征传感采集</text>
  <text x="56"  y="197" text-anchor="middle" font-size="10">心率 / 睡眠 / 步数</text>

  <rect x="119" y="168" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="168" y="183" text-anchor="middle" font-size="10">关系型数据库</text>
  <text x="168" y="197" text-anchor="middle" font-size="10">SQLite / MySQL</text>

  <rect x="231" y="168" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="183" text-anchor="middle" font-size="10">DeepSeek 大模型</text>
  <text x="280" y="197" text-anchor="middle" font-size="10">深度健康分析</text>

  <rect x="343" y="168" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="392" y="183" text-anchor="middle" font-size="10">可视化健康</text>
  <text x="392" y="197" text-anchor="middle" font-size="10">数据仪表盘</text>

  <rect x="455" y="168" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="504" y="183" text-anchor="middle" font-size="10">用户认证</text>
  <text x="504" y="197" text-anchor="middle" font-size="10">与授权管理</text>

  <!-- 连线：子项1底(y=204) → 子项2顶(y=214) -->
  <line x1="56"  y1="204" x2="56"  y2="214" stroke="#000" stroke-width="1.3"/>
  <line x1="168" y1="204" x2="168" y2="214" stroke="#000" stroke-width="1.3"/>
  <line x1="280" y1="204" x2="280" y2="214" stroke="#000" stroke-width="1.3"/>
  <line x1="392" y1="204" x2="392" y2="214" stroke="#000" stroke-width="1.3"/>
  <line x1="504" y1="204" x2="504" y2="214" stroke="#000" stroke-width="1.3"/>

  <!-- ── 子项 2（y=214, h=36, 底=250）── -->
  <rect x="7"   y="214" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="56"  y="229" text-anchor="middle" font-size="10">人脸情绪</text>
  <text x="56"  y="243" text-anchor="middle" font-size="10">实时识别分析</text>

  <rect x="119" y="214" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="168" y="229" text-anchor="middle" font-size="10">ORM 数据模型</text>
  <text x="168" y="243" text-anchor="middle" font-size="10">设计与迁移管理</text>

  <rect x="231" y="214" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="229" text-anchor="middle" font-size="10">健康风险</text>
  <text x="280" y="243" text-anchor="middle" font-size="10">等级评估策略</text>

  <rect x="343" y="214" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="392" y="229" text-anchor="middle" font-size="10">SOS 紧急告警</text>
  <text x="392" y="243" text-anchor="middle" font-size="10">家属实时推送</text>

  <rect x="455" y="214" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="504" y="229" text-anchor="middle" font-size="10">多角色权限</text>
  <text x="504" y="243" text-anchor="middle" font-size="10">三级访问控制</text>

  <!-- 连线：子项2底(y=250) → 子项3顶(y=260) -->
  <line x1="56"  y1="250" x2="56"  y2="260" stroke="#000" stroke-width="1.3"/>
  <line x1="168" y1="250" x2="168" y2="260" stroke="#000" stroke-width="1.3"/>
  <line x1="280" y1="250" x2="280" y2="260" stroke="#000" stroke-width="1.3"/>
  <line x1="392" y1="250" x2="392" y2="260" stroke="#000" stroke-width="1.3"/>
  <line x1="504" y1="250" x2="504" y2="260" stroke="#000" stroke-width="1.3"/>

  <!-- ── 子项 3（y=260, h=36, 底=296）── -->
  <rect x="7"   y="260" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="56"  y="275" text-anchor="middle" font-size="10">健康日记</text>
  <text x="56"  y="289" text-anchor="middle" font-size="10">语义录入解析</text>

  <rect x="119" y="260" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="168" y="275" text-anchor="middle" font-size="10">数据加密</text>
  <text x="168" y="289" text-anchor="middle" font-size="10">安全存储备份</text>

  <rect x="231" y="260" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="275" text-anchor="middle" font-size="10">多模态融合</text>
  <text x="280" y="289" text-anchor="middle" font-size="10">综合健康报告</text>

  <rect x="343" y="260" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="392" y="275" text-anchor="middle" font-size="10">健康周报</text>
  <text x="392" y="289" text-anchor="middle" font-size="10">PDF 导出下载</text>

  <rect x="455" y="260" width="98" height="36" rx="2" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="504" y="275" text-anchor="middle" font-size="10">隐私保护</text>
  <text x="504" y="289" text-anchor="middle" font-size="10">数据安全合规</text>

  <!-- ══════════ 分隔虚线 ══════════ -->
  <line x1="7" y1="314" x2="553" y2="314" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ══════════ 系统核心设计原则汇总框 ══════════ -->
  <rect x="7" y="324" width="546" height="114" rx="4"
        fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" font-weight="bold">系统核心设计原则</text>

  <!-- 列分隔线（三列，每列宽 182px） -->
  <line x1="189" y1="354" x2="189" y2="428" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="371" y1="354" x2="371" y2="428" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 列1 center=98 -->
  <text x="98"  y="368" text-anchor="middle" font-size="11" font-weight="bold">健康分析专业性</text>
  <text x="98"  y="385" text-anchor="middle" font-size="10">· 多源生理指标融合采集</text>
  <text x="98"  y="401" text-anchor="middle" font-size="10">· AI 深度干预建议生成</text>
  <text x="98"  y="417" text-anchor="middle" font-size="10">· 差异化风险分级策略</text>

  <!-- 列2 center=280 -->
  <text x="280" y="368" text-anchor="middle" font-size="11" font-weight="bold">用户使用便捷性</text>
  <text x="280" y="385" text-anchor="middle" font-size="10">· 可视化图表数据展示</text>
  <text x="280" y="401" text-anchor="middle" font-size="10">· 一键导出健康 PDF 报告</text>
  <text x="280" y="417" text-anchor="middle" font-size="10">· 多端家庭协同管理</text>

  <!-- 列3 center=462 -->
  <text x="462" y="368" text-anchor="middle" font-size="11" font-weight="bold">数据安全合规性</text>
  <text x="462" y="385" text-anchor="middle" font-size="10">· 最小权限原则设计</text>
  <text x="462" y="401" text-anchor="middle" font-size="10">· 密码哈希加密存储</text>
  <text x="462" y="417" text-anchor="middle" font-size="10">· 三级角色权限管控</text>

  <!-- ══════════ 图题 ══════════ -->
  <text x="280" y="460" text-anchor="middle" font-size="11">图 2-1　智慧家居健康分析系统功能需求架构图</text>

</svg>
</body>
</html>
