<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 portrait; margin: 2.5cm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "SimSun", "宋体", "Microsoft YaHei", serif;
    background: #fff;
    width: 210mm;
    padding: 2.5cm;
  }
  svg { display: block; width: 165mm; }
</style>
</head>
<body>
<!--
  主流程框（x=130, w=300, center=280）
  分支框：
    左  x=10,  w=150, center=85   右边界=160
    中  x=195, w=170, center=280  左边界=195（间距35px）右边界=365
    右  x=400, w=150, center=475  左边界=400（间距35px）右边界=550
-->
<svg viewBox="0 0 560 502" xmlns="http://www.w3.org/2000/svg"
     font-family="SimSun, 宋体, Microsoft YaHei, serif">

  <!-- ══════════ 标题 ══════════ -->
  <rect x="60" y="6" width="440" height="52" rx="4"
        fill="#fff" stroke="#000" stroke-width="2.2"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold">智慧家居健康分析系统</text>
  <text x="280" y="49" text-anchor="middle" font-size="15" font-weight="bold">数据全链路流程设计</text>

  <!-- ══════════ BOX 1：感知层数据采集  y=66, h=60 ══════════ -->
  <rect x="130" y="66" width="300" height="60" rx="4"
        fill="#fff" stroke="#000" stroke-width="1.8"/>
  <line x1="130" y1="88" x2="430" y2="88" stroke="#000" stroke-width="1.2"/>
  <text x="280" y="81"  text-anchor="middle" font-size="12" font-weight="bold">感知层数据采集</text>
  <text x="280" y="101" text-anchor="middle" font-size="10">用户体征：心率 · 睡眠时长 · 步数</text>
  <text x="280" y="117" text-anchor="middle" font-size="10">环境参数：温湿度 · CO₂ 浓度</text>

  <!-- 箭头1 → BOX2 -->
  <line x1="280" y1="126" x2="280" y2="135" stroke="#000" stroke-width="1.4"/>
  <polygon points="280,142 274,134 286,134" fill="#000"/>

  <!-- ══════════ BOX 2：HTTP传输与校验  y=142, h=44 ══════════ -->
  <rect x="130" y="142" width="300" height="44" rx="4"
        fill="#fff" stroke="#000" stroke-width="1.8"/>
  <line x1="130" y1="163" x2="430" y2="163" stroke="#000" stroke-width="1.1"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" font-weight="bold">HTTP 传输 · JSON 轻量封装</text>
  <text x="280" y="178" text-anchor="middle" font-size="10">范围合规校验（心率 30—220 bpm）</text>

  <!-- 箭头2 → BOX3 -->
  <line x1="280" y1="186" x2="280" y2="195" stroke="#000" stroke-width="1.4"/>
  <polygon points="280,202 274,194 286,194" fill="#000"/>

  <!-- ══════════ BOX 3：随机森林实时分析  y=202, h=44 ══════════ -->
  <rect x="130" y="202" width="300" height="44" rx="4"
        fill="#fff" stroke="#000" stroke-width="1.8"/>
  <line x1="130" y1="222" x2="430" y2="222" stroke="#000" stroke-width="1.1"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" font-weight="bold">随机森林模型实时健康分析</text>
  <text x="280" y="238" text-anchor="middle" font-size="10">scikit-learn · 推理延迟 ≤5ms · 输出健康评分与风险等级</text>

  <!-- 箭头3 → BOX4 -->
  <line x1="280" y1="246" x2="280" y2="255" stroke="#000" stroke-width="1.4"/>
  <polygon points="280,262 274,254 286,254" fill="#000"/>

  <!-- ══════════ BOX 4：MySQL结构化存储  y=262, h=44 ══════════ -->
  <rect x="130" y="262" width="300" height="44" rx="4"
        fill="#fff" stroke="#000" stroke-width="1.8"/>
  <line x1="130" y1="282" x2="430" y2="282" stroke="#000" stroke-width="1.1"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" font-weight="bold">写入 MySQL 结构化存储</text>
  <text x="280" y="298" text-anchor="middle" font-size="10">分区表（用户ID哈希分布）· 组合索引优化高频查询字段</text>

  <!-- ══════════ 分叉连线 ══════════ -->
  <!-- 垂直主干下行 -->
  <line x1="280" y1="306" x2="280" y2="322" stroke="#000" stroke-width="1.4"/>
  <!-- 水平分叉横线 -->
  <line x1="85" y1="322" x2="475" y2="322" stroke="#000" stroke-width="1.4"/>
  <!-- 三条支路下行 + 箭头 -->
  <line x1="85"  y1="322" x2="85"  y2="332" stroke="#000" stroke-width="1.3"/>
  <polygon points="85,338  79,331  91,331"  fill="#000"/>
  <line x1="280" y1="322" x2="280" y2="332" stroke="#000" stroke-width="1.3"/>
  <polygon points="280,338 274,331 286,331" fill="#000"/>
  <line x1="475" y1="322" x2="475" y2="332" stroke="#000" stroke-width="1.3"/>
  <polygon points="475,338 469,331 481,331" fill="#000"/>

  <!-- ══════════════════════════════════════════
       左支路：SOS 同步预警链路
       center=85, x=10, w=150
  ══════════════════════════════════════════ -->
  <rect x="10" y="338" width="150" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="85" y="354" text-anchor="middle" font-size="10" font-weight="bold">SOS 同步预警检测</text>
  <text x="85" y="369" text-anchor="middle" font-size="9.5">心率 &gt; 120 bpm 触发告警</text>

  <line x1="85" y1="376" x2="85" y2="384" stroke="#000" stroke-width="1.2"/>
  <polygon points="85,390 79,383 91,383" fill="#000"/>

  <rect x="10" y="390" width="150" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="85" y="406" text-anchor="middle" font-size="10" font-weight="bold">Flask-Mail 邮件推送</text>
  <text x="85" y="421" text-anchor="middle" font-size="9.5">响应延迟 &lt; 200ms</text>

  <!-- ══════════════════════════════════════════
       中支路：前端可视化展示链路
       center=280, x=195, w=170
  ══════════════════════════════════════════ -->
  <rect x="195" y="338" width="170" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="354" text-anchor="middle" font-size="10" font-weight="bold">SQLAlchemy ORM 数据映射</text>
  <text x="280" y="369" text-anchor="middle" font-size="9.5">结构化数据传递 Vue 3 前端</text>

  <line x1="280" y1="376" x2="280" y2="384" stroke="#000" stroke-width="1.2"/>
  <polygon points="280,390 274,383 286,383" fill="#000"/>

  <rect x="195" y="390" width="170" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="406" text-anchor="middle" font-size="10" font-weight="bold">ECharts 5 多维可视化</text>
  <text x="280" y="421" text-anchor="middle" font-size="9.5">折线图趋势 · 雷达图关联分析</text>

  <line x1="280" y1="428" x2="280" y2="436" stroke="#000" stroke-width="1.2"/>
  <polygon points="280,442 274,435 286,435" fill="#000"/>

  <rect x="195" y="442" width="170" height="36" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="280" y="457" text-anchor="middle" font-size="10" font-weight="bold">Axios 每5秒轮询刷新</text>
  <text x="280" y="471" text-anchor="middle" font-size="9.5">体征指标实时更新展示</text>

  <!-- ══════════════════════════════════════════
       右支路：异步深度分析链路
       center=475, x=400, w=150
  ══════════════════════════════════════════ -->
  <rect x="400" y="338" width="150" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="475" y="354" text-anchor="middle" font-size="10" font-weight="bold">异步线程池管理</text>
  <text x="475" y="369" text-anchor="middle" font-size="9.5">独立线程 · 非阻塞核心业务</text>

  <line x1="475" y1="376" x2="475" y2="384" stroke="#000" stroke-width="1.2"/>
  <polygon points="475,390 469,383 481,383" fill="#000"/>

  <rect x="400" y="390" width="150" height="38" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="475" y="406" text-anchor="middle" font-size="10" font-weight="bold">DeepSeek API 调用</text>
  <text x="475" y="421" text-anchor="middle" font-size="9.5">体征均值+画像注入提示词</text>

  <line x1="475" y1="428" x2="475" y2="436" stroke="#000" stroke-width="1.2"/>
  <polygon points="475,442 469,435 481,435" fill="#000"/>

  <rect x="400" y="442" width="150" height="36" rx="3"
        fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="475" y="457" text-anchor="middle" font-size="10" font-weight="bold">生成个性化干预方案</text>
  <text x="475" y="471" text-anchor="middle" font-size="9.5">千字健康报告文本输出</text>

  <!-- ══════════ 图题 ══════════ -->
  <text x="280" y="496" text-anchor="middle" font-size="11">图 2-4　智慧家居健康分析系统数据全链路流程图</text>

</svg>
</body>
</html>
