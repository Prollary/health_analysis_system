<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧家居健康舱</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>HealthAI 智慧舱</span>
        </div>
        <div class="user-profile">
            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix" alt="User Avatar" class="avatar">
            <span>管理员 (ID: 1)</span>
        </div>
    </header>

    <main class="container">

        <section class="kpi-grid">
            <div class="kpi-card">
                <div class="icon-box red"><i class="fa-solid fa-wave-square"></i></div>
                <div class="kpi-info">
                    <h3>平均心率</h3>
                    <p id="kpi-hr">-- <span>bpm</span></p>
                </div>
            </div>
            <div class="kpi-card">
                <div class="icon-box blue"><i class="fa-solid fa-moon"></i></div>
                <div class="kpi-info">
                    <h3>昨晚睡眠</h3>
                    <p id="kpi-sleep">-- <span>h</span></p>
                </div>
            </div>
            <div class="kpi-card">
                <div class="icon-box green"><i class="fa-solid fa-shoe-prints"></i></div>
                <div class="kpi-info">
                    <h3>今日步数</h3>
                    <p id="kpi-steps">-- <span>步</span></p>
                </div>
            </div>
        </section>

        <section class="main-grid">
            <div class="chart-container card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-chart-line"></i> 体征趋势对比分析</h2>
                </div>
                <div id="mainChart" class="chart-area"></div>
            </div>

            <div class="ai-console card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-robot"></i> 实时 AI 诊断</h2>
                </div>

                <form id="healthForm" class="health-form">
                    <div class="input-group">
                        <label><i class="fa-solid fa-heart"></i> 即时心率</label>
                        <input type="number" id="input-hr" placeholder="例如: 75" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fa-solid fa-bed"></i> 睡眠时长</label>
                        <input type="number" step="0.1" id="input-sleep" placeholder="例如: 7.5" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fa-solid fa-person-walking"></i> 今日步数</label>
                        <input type="number" id="input-steps" placeholder="例如: 8000" required>
                    </div>
                    <button type="submit" class="btn-primary" id="analyzeBtn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 启动 AI 分析
                    </button>
                </form>

                <div id="ai-result" class="ai-result hidden">
                    <div class="score-circle">
                        <span id="res-score">95</span>
                    </div>
                    <div class="result-text">
                        <h3 id="res-level">健康状态</h3>
                        <p id="res-suggestion">正在等待数据接入...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/script.js"></script>
</body>

</html>
