<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧家居健康分析中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            margin-bottom: 20px;
        }

        #chart-container {
            height: 400px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">🏡 智慧家居健康分析中心</h2>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">实时健康指标趋势</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">🧠 AI 健康大脑</h5>
                    </div>
                    <div class="card-body text-center">
                        <button class="btn btn-success w-100 mb-3" onclick="triggerAI()">一键 AI 深度诊断</button>

                        <div id="ai-result" style="display: none;">
                            <h1 id="health-score" class="text-success display-4 font-weight-bold">--</h1>
                            <p class="text-muted">综合健康分</p>
                            <span id="risk-badge" class="badge bg-success mb-3">状态未知</span>
                            <p id="ai-suggestion" class="text-start bg-light p-3 rounded text-secondary"
                                style="font-size: 0.9em;">
                                等待诊断...
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 初始化 ECharts 实例
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom);

        // 2. 获取历史数据并渲染图表 (对接 GET /api/health/history)
        async function loadChartData() {
            try {
                const response = await fetch('/api/health/history');
                const result = await response.json();

                // 配置 ECharts 选项
                const option = {
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['心率(bpm)', '步数(百步)'] },
                    xAxis: { type: 'category', data: result.times },
                    yAxis: [
                        { type: 'value', name: '心率' },
                        { type: 'value', name: '步数 (x100)' } // 缩放步数以便在同个图表展示
                    ],
                    series: [
                        {
                            name: '心率(bpm)',
                            type: 'line',
                            smooth: true,
                            data: result.heart_rates,
                            itemStyle: { color: '#ff6b6b' }
                        },
                        {
                            name: '步数(百步)',
                            type: 'bar',
                            yAxisIndex: 1,
                            data: result.steps.map(s => s / 100), // 步数除以100
                            itemStyle: { color: '#4dabf7' }
                        }
                    ]
                };
                myChart.setOption(option);
            } catch (error) {
                console.error("加载图表数据失败:", error);
            }
        }

        // 3. 触发 AI 诊断 (对接 POST /api/analyze/1)
        async function triggerAI() {
            const btn = document.querySelector('button');
            btn.innerText = "🧠 正在连线 AI 大脑计算中...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/analyze/1', { method: 'POST' });
                const res = await response.json();

                if (res.code === 200) {
                    const data = res.data;
                    // 显示结果区域
                    document.getElementById('ai-result').style.display = 'block';

                    // 更新分数
                    document.getElementById('health-score').innerText = data.health_score;

                    // 更新风险等级 UI
                    const badge = document.getElementById('risk-badge');
                    badge.innerText = data.risk_level;
                    if (data.risk_level === '低风险') badge.className = 'badge bg-success mb-3';
                    else if (data.risk_level === '中风险') badge.className = 'badge bg-warning text-dark mb-3';
                    else badge.className = 'badge bg-danger mb-3';

                    // 更新建议
                    document.getElementById('ai-suggestion').innerText = data.suggestion;
                } else {
                    alert("AI 分析出错: " + res.msg);
                }
            } catch (error) {
                alert("请求失败，请检查后端运行状态。");
            } finally {
                btn.innerText = "重新执行 AI 诊断";
                btn.disabled = false;
            }
        }

        // 页面加载完成后立即渲染一次图表
        loadChartData();
        // 设定每 5 秒刷新一次图表（实现动态心率效果）
        setInterval(loadChartData, 5000);
    </script>
</body>

</html>
